<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0" />
  <title>Login — KisanTrack | स्मार्ट पशु निगरानी</title>
  
  <!-- Google Fonts -->
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700;800&family=Noto+Sans:wght@400;500;600&display=swap" rel="stylesheet" />

  <!-- Font Awesome 6 -->
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css" />

  <!-- App Stylesheets -->
  <link rel="stylesheet" href="css/main.css" />
  <link rel="stylesheet" href="css/animations.css" />
  <link rel="stylesheet" href="css/auth.css" />

  <!-- Firebase App (the core Firebase SDK) is always required and must be listed first -->
  <script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-auth-compat.js"></script>
</head>

<body>

  <div id="auth-screen" class="split-auth">
    
    <!-- LEFT PANEL: Brand Image -->
    <div class="auth-left">
      <div class="auth-left-overlay"></div>
      <div class="auth-left-content">
        <div class="auth-logo-large">🐄</div>
        <h1 class="auth-brand-title">Next-Gen Farming.</h1>
        <p class="auth-brand-subtitle">AI-powered livestock monitoring for your herd's safety.</p>
        <div style="margin-top: 2rem;">
            <a href="index.html" class="btn-auth-text" style="color: rgba(255,255,255,0.7); text-decoration: none;">
                <i class="fa-solid fa-arrow-left"></i> Back to Home / होम पर वापस जाएं
            </a>
        </div>
      </div>
    </div>

    <!-- RIGHT PANEL: Forms -->
    <div class="auth-right">
      <div class="auth-card">
        <div class="auth-header">
          <h2 class="auth-title">Welcome to KisanTrack</h2>
          <p class="auth-subtitle">Smart Livestock Monitoring <br> स्मार्ट पशु निगरानी</p>
        </div>

        <div class="auth-tabs">
          <button class="auth-tab active" id="tab-login" aria-selected="true">Login / लॉगिन</button>
          <button class="auth-tab" id="tab-signup" aria-selected="false">Sign Up / साइन अप</button>
          <div class="auth-tab-slider" id="auth-tab-slider"></div>
        </div>

        <div class="auth-forms-wrapper">
          <!-- Login Form -->
          <form id="login-form" class="auth-form active">
            <div class="auth-field">
              <i class="fa-solid fa-envelope"></i>
              <input type="email" id="login-email" placeholder="Email Address" required />
            </div>
            <div class="auth-field">
              <i class="fa-solid fa-lock"></i>
              <input type="password" id="login-password" placeholder="Password" required />
              <button type="button" class="auth-eye-btn" id="login-eye" aria-label="Toggle password visibility">
                <i class="fa-solid fa-eye"></i>
              </button>
            </div>
            
            <div class="auth-error-msg" id="login-error"></div>
            
            <button type="submit" class="btn-auth-primary" id="btn-login-submit">Login / लॉगिन</button>
            <div style="text-align: center; margin-top: 12px;">
              <button type="button" class="btn-auth-text" id="btn-forgot-password">Forgot Password?</button>
            </div>
          </form>

          <!-- Signup Form -->
          <form id="signup-form" class="auth-form">
            <div class="auth-field">
              <i class="fa-solid fa-user"></i>
              <input type="text" id="signup-name" placeholder="Full Name" required />
            </div>
            <div class="auth-field">
              <i class="fa-solid fa-tractor"></i>
              <input type="text" id="signup-farm" placeholder="Farm Name" required />
            </div>
            <div class="auth-field">
              <i class="fa-solid fa-envelope"></i>
              <input type="email" id="signup-email" placeholder="Email Address" required />
            </div>
            <div class="auth-field">
              <i class="fa-solid fa-lock"></i>
              <input type="password" id="signup-password" placeholder="Password (min 6 chars)" required />
              <button type="button" class="auth-eye-btn" id="signup-eye" aria-label="Toggle password visibility">
                <i class="fa-solid fa-eye"></i>
              </button>
            </div>
            <div class="auth-field">
              <i class="fa-solid fa-lock"></i>
              <input type="password" id="signup-confirm" placeholder="Confirm Password" required />
              <button type="button" class="auth-eye-btn" id="signup-confirm-eye" aria-label="Toggle confirm password visibility">
                <i class="fa-solid fa-eye"></i>
              </button>
            </div>
            
            <div class="auth-error-msg" id="signup-error"></div>
            
            <button type="submit" class="btn-auth-primary" id="btn-signup-submit">Create Account / खाता बनाएं</button>
          </form>
        </div>

        <div class="auth-divider">
          <div class="divider-line"></div>
          <span>or log in with</span>
          <div class="divider-line"></div>
        </div>

        <button type="button" class="btn-auth-google" id="btn-google-login">
          <i class="fa-brands fa-google"></i> Continue with Google
        </button>
      </div>
    </div>
  </div>

  <div class="toast" id="app-toast" role="alert" aria-live="polite">
    <i class="fa-solid fa-circle-check toast-icon"></i>
    <span class="toast-msg" id="toast-msg"></span>
  </div>

  <script src="js/utils.js"></script>
  <script src="js/auth.js"></script>
</body>

</html>
