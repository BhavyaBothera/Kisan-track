<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0" />
  <title>KisanTrack | Obsidian AI</title>
  
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css" />

  <style>
    /* ─────────────────────────────────────────────────────────────
       OBSIDIAN DESIGN SYSTEM
    ───────────────────────────────────────────────────────────── */
    :root {
      --bg: #030504;
      --accent: #7CB518;
      --accent-glow: rgba(124, 181, 24, 0.15);
      --amber: #E5A100;
      --text-main: #FFFFFF;
      --text-dim: #888888;
      --glass-bg: rgba(10, 15, 12, 0.4);
      --glass-border: rgba(255, 255, 255, 0.05);
      --error: #FF4B2B;
    }

    * { margin: 0; padding: 0; box-sizing: border-box; -webkit-font-smoothing: antialiased; }

    body {
      background-color: var(--bg);
      color: var(--text-main);
      font-family: 'Inter', sans-serif;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 20px;
      overflow-y: auto; /* Allow scroll if content too tall */
    }

    /* ─────────────────────────────────────────────────────────────
       CINEMATIC BACKGROUND
    ───────────────────────────────────────────────────────────── */
    .aurora-container {
      position: fixed;
      top: 0; left: 0; width: 100%; height: 100%;
      z-index: -1;
      overflow: hidden;
      background: #030504;
    }

    .bg-image {
      position: absolute;
      top: 0; left: 0; width: 100%; height: 100%;
      background: url('kisantrack_auth_bg.png') no-repeat center center;
      background-size: cover;
      opacity: 0.6; /* Increased for better visibility */
      filter: brightness(0.8) contrast(1.1) saturate(0.9);
      z-index: 1;
    }

    .bg-overlay {
      position: absolute;
      top: 0; left: 0; width: 100%; height: 100%;
      background: radial-gradient(circle at 50% 50%, transparent 20%, #030504 90%);
      z-index: 2;
    }

    .aurora-glow {
      position: absolute;
      width: 800px; height: 800px;
      background: radial-gradient(circle, var(--accent-glow) 0%, transparent 70%);
      border-radius: 50%;
      pointer-events: none;
      transform: translate(-50%, -50%);
      transition: width 1s, height 1s;
      filter: blur(80px);
      z-index: 3;
    }

    /* ─────────────────────────────────────────────────────────────
       THE OBSIDIAN MODULE
    ───────────────────────────────────────────────────────────── */
    .obsidian-wrapper {
      width: 100%;
      max-width: 440px;
      position: relative;
      z-index: 10;
      text-align: center;
    }

    .obsidian-logo {
      font-size: 28px;
      font-weight: 700;
      letter-spacing: -1.5px;
      margin-bottom: 40px;
      opacity: 0.9;
    }
    .obsidian-logo span { color: var(--accent); }

    .obsidian-card {
      background: var(--glass-bg);
      backdrop-filter: blur(40px);
      -webkit-backdrop-filter: blur(40px);
      border: 1px solid var(--glass-border);
      border-radius: 24px;
      padding: 40px; /* Slightly reduced */
      box-shadow: 0 50px 100px rgba(0,0,0,0.8), inset 0 0 20px rgba(255,255,255,0.02);
      position: relative;
    }

    .obsidian-card::after {
      content: '';
      position: absolute;
      inset: -1px;
      border-radius: 24px;
      padding: 1px;
      background: linear-gradient(135deg, rgba(255,255,255,0.1), transparent, rgba(124, 181, 24, 0.1));
      -webkit-mask: linear-gradient(#fff 0 0) content-box, linear-gradient(#fff 0 0);
      mask: linear-gradient(#fff 0 0) content-box, linear-gradient(#fff 0 0);
      -webkit-mask-composite: xor;
      mask-composite: exclude;
      pointer-events: none;
    }

    /* Tabs */
    .obsidian-tabs {
      display: flex;
      margin-bottom: 40px;
      border-bottom: 1px solid var(--glass-border);
      position: relative;
    }
    .obsidian-tab {
      flex: 1;
      padding: 12px;
      font-size: 13px;
      font-weight: 600;
      color: var(--text-dim);
      cursor: pointer;
      text-transform: uppercase;
      letter-spacing: 2px;
      transition: color 0.3s;
    }
    .obsidian-tab.active { color: var(--accent); }
    
    .obsidian-pill {
      position: absolute;
      bottom: -1px; left: 0;
      width: 50%; height: 2px;
      background: var(--accent);
      transition: transform 0.4s cubic-bezier(0.19, 1, 0.22, 1);
      box-shadow: 0 0 10px var(--accent);
    }

    /* Form Layout */
    .form-stack { 
      position: relative; 
      display: grid;
      grid-template-rows: 1fr;
    }
    .obsidian-form {
      grid-area: 1 / 1 / 2 / 2;
      opacity: 0; 
      pointer-events: none;
      transform: translateY(10px);
      transition: all 0.4s cubic-bezier(0.19, 1, 0.22, 1);
    }
    .obsidian-form.active { 
      opacity: 1; 
      pointer-events: all; 
      transform: translateY(0);
      position: relative; /* Takes up space when active */
    }

    /* Inputs */
    .input-group { margin-bottom: 24px; text-align: left; }
    .input-label { 
      font-size: 11px; font-weight: 700; color: var(--text-dim); 
      text-transform: uppercase; letter-spacing: 1.5px; margin-bottom: 8px; display: block;
    }
    .obsidian-input-box {
      background: rgba(0,0,0,0.4);
      border: 1px solid var(--glass-border);
      border-radius: 12px;
      padding: 12px 16px; /* Slightly more compact */
      display: flex; align-items: center; gap: 12px;
      transition: all 0.3s;
    }
    .obsidian-input-box:focus-within {
      border-color: var(--accent);
      background: rgba(0,0,0,0.6);
      box-shadow: 0 0 20px rgba(124, 181, 24, 0.05);
    }
    .obsidian-input-box i { color: var(--text-dim); font-size: 16px; }
    .obsidian-input {
      flex: 1; background: none; border: none; color: white; font-family: inherit; font-size: 14px; outline: none;
    }
    .obsidian-input::placeholder { color: #333; }

    .eye-toggle { background: none; border: none; color: var(--text-dim); cursor: pointer; }

    /* Buttons */
    .btn-obsidian {
      width: 100%;
      padding: 16px;
      border-radius: 12px;
      border: 1px solid var(--accent);
      background: transparent;
      color: var(--accent);
      font-family: inherit; font-weight: 700; font-size: 14px;
      text-transform: uppercase; letter-spacing: 2px;
      cursor: pointer;
      transition: all 0.3s;
      margin-top: 10px;
    }
    .btn-obsidian:hover {
      background: var(--accent);
      color: black;
      box-shadow: 0 0 30px var(--accent-glow);
    }

    .btn-google {
      width: 100%; padding: 14px; border-radius: 12px;
      background: transparent; border: 1px solid var(--glass-border);
      color: var(--text-dim); font-family: inherit; font-size: 13px; font-weight: 600;
      display: flex; align-items: center; justify-content: center; gap: 12px;
      margin-top: 24px; cursor: pointer; transition: all 0.3s;
    }
    .btn-google:hover { border-color: white; color: white; }

    .forgot-link {
      display: block; text-align: center; margin-top: 20px;
      font-size: 12px; color: var(--text-dim); text-decoration: none; transition: color 0.3s;
    }
    .forgot-link:hover { color: var(--amber); }

    .error-log { color: var(--error); font-size: 12px; margin-top: 12px; min-height: 16px; font-weight: 600; }

    /* Toast */
    .toast {
      position: fixed; top: 30px; left: 50%; transform: translateX(-50%) translateY(-100px);
      background: var(--accent); color: black; padding: 12px 30px; border-radius: 50px;
      font-weight: 700; font-size: 14px; z-index: 1000; transition: all 0.4s;
    }
    .toast.show { transform: translateX(-50%) translateY(0); }

    /* Mobile */
    @media (max-width: 480px) {
      .obsidian-card { padding: 30px 20px; border-radius: 20px; background: var(--glass-bg); box-shadow: 0 20px 50px rgba(0,0,0,0.5); }
      .obsidian-logo { margin-bottom: 24px; font-size: 24px; }
      body { align-items: flex-start; padding: 40px 15px; }
    }
  </style>
</head>
<body>

  <div class="aurora-container">
    <div class="bg-image"></div>
    <div class="bg-overlay"></div>
    <div class="aurora-glow" id="aurora"></div>
  </div>

  <div class="obsidian-wrapper">
    <div class="obsidian-logo">KISAN<span>TRACK</span></div>

    <div class="obsidian-card">
      <div class="obsidian-tabs">
        <div class="obsidian-tab active" id="tab-login">Login</div>
        <div class="obsidian-tab" id="tab-signup">Register</div>
        <div class="obsidian-pill" id="auth-tab-slider"></div>
      </div>

      <div class="form-stack">
        <!-- LOGIN -->
        <form id="login-form" class="obsidian-form active">
          <div class="input-group">
            <span class="input-label">Identity</span>
            <div class="obsidian-input-box">
              <i class="fa-solid fa-envelope"></i>
              <input type="email" id="login-email" class="obsidian-input" placeholder="Email Address" required />
            </div>
          </div>
          <div class="input-group">
            <span class="input-label">Security</span>
            <div class="obsidian-input-box">
              <i class="fa-solid fa-lock"></i>
              <input type="password" id="login-password" class="obsidian-input" placeholder="Password" required />
              <button type="button" class="eye-toggle" id="login-eye"><i class="fa-solid fa-eye"></i></button>
            </div>
          </div>
          <div class="error-log" id="login-error"></div>
          <button type="submit" class="btn-obsidian" id="btn-login-submit">Authenticate</button>
          <a href="#" class="forgot-link" id="btn-forgot-password">Recovery key needed?</a>
        </form>

        <!-- SIGNUP -->
        <form id="signup-form" class="obsidian-form">
          <div class="input-group">
            <span class="input-label">Full Name</span>
            <div class="obsidian-input-box">
              <i class="fa-solid fa-user"></i>
              <input type="text" id="signup-name" class="obsidian-input" placeholder="Your Name" required />
            </div>
          </div>
          <div class="input-group">
            <span class="input-label">Farm Identity</span>
            <div class="obsidian-input-box">
              <i class="fa-solid fa-tractor"></i>
              <input type="text" id="signup-farm" class="obsidian-input" placeholder="Farm Name" required />
            </div>
          </div>
          <div class="input-group">
            <span class="input-label">Email</span>
            <div class="obsidian-input-box">
              <i class="fa-solid fa-envelope"></i>
              <input type="email" id="signup-email" class="obsidian-input" placeholder="Email" required />
            </div>
          </div>
          <div class="input-group">
            <span class="input-label">Password</span>
            <div class="obsidian-input-box">
              <i class="fa-solid fa-lock"></i>
              <input type="password" id="signup-password" class="obsidian-input" placeholder="Create Password" required />
              <button type="button" class="eye-toggle" id="signup-eye"><i class="fa-solid fa-eye"></i></button>
            </div>
          </div>
          <div class="error-log" id="signup-error"></div>
          <button type="submit" class="btn-obsidian" id="btn-signup-submit">Initialize Profile</button>
        </form>
      </div>

      <button type="button" class="btn-google" id="btn-google-login">
        <i class="fa-brands fa-google"></i> Continue with Google Cloud
      </button>
    </div>

    <a href="index.html" class="forgot-link" style="margin-top: 40px; opacity: 0.5;">
      <i class="fa-solid fa-arrow-left"></i> Terminal Entry
    </a>
  </div>

  <div class="toast" id="app-toast">Authenticated Successfully</div>

  <!-- Firebase -->
  <script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-auth-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore-compat.js"></script>
  <script src="js/utils.js"></script>
  <script src="js/firebase-init.js"></script>
  <script src="js/auth.js"></script>

  <script>
    // AURORA MOUSE FOLLOW
    const aurora = document.getElementById('aurora');
    document.addEventListener('mousemove', (e) => {
      const x = e.clientX;
      const y = e.clientY;
      aurora.style.left = x + 'px';
      aurora.style.top = y + 'px';
    });

    // SYNC TABS (Compatible with auth.js IDs)
    const tLogin = document.getElementById('tab-login');
    const tSignup = document.getElementById('tab-signup');
    const tSlider = document.getElementById('auth-tab-slider');
    const fLogin = document.getElementById('login-form');
    const fSignup = document.getElementById('signup-form');

    function switchTab(t) {
      if(t === 'login') {
        tLogin.classList.add('active'); tSignup.classList.remove('active');
        tSlider.style.transform = 'translateX(0)';
        fLogin.classList.add('active'); fSignup.classList.remove('active');
      } else {
        tSignup.classList.add('active'); tLogin.classList.remove('active');
        tSlider.style.transform = 'translateX(100%)';
        fSignup.classList.add('active'); fLogin.classList.remove('active');
      }
    }

    tLogin.addEventListener('click', () => switchTab('login'));
    tSignup.addEventListener('click', () => switchTab('signup'));

    // URL Tab Handler
    const params = new URLSearchParams(window.location.search);
    if(params.get('tab') === 'signup') switchTab('signup');
  </script>
</body>
</html>
