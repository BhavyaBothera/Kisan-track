<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0" />
  <title>KisanTrack | Secure Access</title>
  
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;500;600;700;800&family=Noto+Sans:wght@400;500;600&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css" />
  <link rel="stylesheet" href="css/auth.css" />
</head>
<body>

  <div class="mesh-bg">
    <div class="blob blob-1"></div>
    <div class="blob blob-2"></div>
    <div class="blob blob-3"></div>
  </div>

  <div class="auth-wrapper" id="auth-wrapper">
    <div class="auth-header">
      <div class="logo-container">
        <div class="logo-emoji">🐄</div>
      </div>
      <h1 class="auth-title">Kisan<span>Track</span></h1>
      <p class="auth-subtitle">AI-Powered Livestock Intelligence</p>
    </div>

    <div class="auth-card" id="auth-card">
      <div class="tab-container">
        <div class="tab-btn active" id="tab-login">Login</div>
        <div class="tab-btn" id="tab-signup">Join Us</div>
        <div class="tab-slider" id="auth-tab-slider"></div>
      </div>

      <div class="form-stack">
        <!-- Login -->
        <form id="login-form" class="auth-form active">
          <div class="input-group">
            <i class="fa-solid fa-envelope"></i>
            <input type="email" id="login-email" class="premium-input" placeholder="Email Address" required />
          </div>
          <div class="input-group">
            <i class="fa-solid fa-lock"></i>
            <input type="password" id="login-password" class="premium-input" placeholder="Password" required />
            <button type="button" class="eye-toggle" id="login-eye"><i class="fa-solid fa-eye"></i></button>
          </div>
          <div class="auth-error" id="login-error"></div>
          <button type="submit" class="btn-submit" id="btn-login-submit">
            Access Dashboard <i class="fa-solid fa-chevron-right"></i>
          </button>
          <a class="forgot-link" id="btn-forgot-password">Trouble signing in?</a>
        </form>

        <!-- Signup -->
        <form id="signup-form" class="auth-form">
          <div class="input-group">
            <i class="fa-solid fa-user"></i>
            <input type="text" id="signup-name" class="premium-input" placeholder="Full Name" required />
          </div>
          <div class="input-group">
            <i class="fa-solid fa-tractor"></i>
            <input type="text" id="signup-farm" class="premium-input" placeholder="Farm Name" required />
          </div>
          <div class="input-group">
            <i class="fa-solid fa-envelope"></i>
            <input type="email" id="signup-email" class="premium-input" placeholder="Email Address" required />
          </div>
          <div class="input-group">
            <i class="fa-solid fa-lock"></i>
            <input type="password" id="signup-password" class="premium-input" placeholder="Create Password" required />
            <button type="button" class="eye-toggle" id="signup-eye"><i class="fa-solid fa-eye"></i></button>
          </div>
          <div class="input-group">
            <i class="fa-solid fa-shield-check"></i>
            <input type="password" id="signup-confirm" class="premium-input" placeholder="Confirm Password" required />
            <button type="button" class="eye-toggle" id="signup-confirm-eye"><i class="fa-solid fa-eye"></i></button>
          </div>
          <div class="auth-error" id="signup-error"></div>
          <button type="submit" class="btn-submit" id="btn-signup-submit">
            Create Farm Profile <i class="fa-solid fa-paper-plane"></i>
          </button>
        </form>
      </div>

      <button type="button" class="btn-google" id="btn-google-login">
        <i class="fa-brands fa-google"></i> Continue with Google
      </button>
    </div>

    <a href="index.html" class="back-btn">
      <i class="fa-solid fa-arrow-left"></i> Return to Landing Page
    </a>
  </div>

  <div class="toast" id="app-toast">
    <i class="fa-solid fa-circle-check"></i>
    <span class="toast-msg" id="toast-msg"></span>
  </div>

  <script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-auth-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore-compat.js"></script>
  <script src="js/utils.js"></script>
  <script src="js/firebase-init.js"></script>
  <script src="js/auth.js"></script>

  <script>
    // 3D Parallax Effect
    const wrapper = document.getElementById('auth-wrapper');
    const card = document.getElementById('auth-card');

    document.addEventListener('mousemove', (e) => {
      if (window.innerWidth < 768) return; // Disable on mobile

      const xAxis = (window.innerWidth / 2 - e.pageX) / 25;
      const yAxis = (window.innerHeight / 2 - e.pageY) / 25;
      
      wrapper.style.transform = `rotateY(${xAxis}deg) rotateX(${yAxis}deg)`;
    });

    // Reset on mouse leave
    document.addEventListener('mouseleave', () => {
      wrapper.style.transform = `rotateY(0deg) rotateX(0deg)`;
    });
  </script>
</body>
</html>
</body>
</html>
