<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0" />
  <title>KisanTrack | Secure Access</title>
  
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;500;600;700;800&family=Noto+Sans:wght@400;500;600&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css" />

  <style>
    :root {
      --primary: #7CB518;
      --primary-glow: rgba(124, 181, 24, 0.4);
      --secondary: #E5A100;
      --bg: #0A0A05;
      --card-bg: rgba(30, 30, 20, 0.6);
      --text: #F0EAD6;
      --text-dim: #A89F8C;
      --border: rgba(255, 255, 255, 0.1);
      --glass-blur: 20px;
    }

    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      background-color: var(--bg);
      color: var(--text);
      font-family: 'Outfit', sans-serif;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      overflow: hidden;
    }

    /* Mesh Gradient Background */
    .mesh-bg {
      position: fixed;
      top: 0; left: 0; width: 100%; height: 100%;
      z-index: -1;
      background: var(--bg);
      filter: blur(100px);
      opacity: 0.8;
    }
    .blob {
      position: absolute;
      width: 500px; height: 500px;
      border-radius: 50%;
      mix-blend-mode: screen;
      animation: move 20s infinite alternate;
    }
    .blob-1 { background: radial-gradient(circle, #2C3E1A 0%, transparent 70%); top: -10%; left: -10%; }
    .blob-2 { background: radial-gradient(circle, #3D2B1F 0%, transparent 70%); bottom: -10%; right: -10%; animation-delay: -5s; }
    .blob-3 { background: radial-gradient(circle, #1A1A2E 0%, transparent 70%); top: 50%; left: 50%; transform: translate(-50%, -50%); animation: pulse 15s infinite alternate; }

    @keyframes move {
      from { transform: translate(0, 0) rotate(0deg); }
      to { transform: translate(100px, 100px) rotate(360deg); }
    }
    @keyframes pulse {
      from { transform: translate(-50%, -50%) scale(1); }
      to { transform: translate(-50%, -50%) scale(1.5); }
    }

    /* Auth Card Container */
    .auth-wrapper {
      width: 100%;
      max-width: 480px;
      padding: 20px;
      position: relative;
    }

    .auth-card {
      background: var(--card-bg);
      backdrop-filter: blur(var(--glass-blur));
      -webkit-backdrop-filter: blur(var(--glass-blur));
      border: 1px solid var(--border);
      border-radius: 32px;
      padding: 48px;
      box-shadow: 0 40px 100px rgba(0, 0, 0, 0.6);
      position: relative;
      overflow: hidden;
    }

    .auth-card::before {
      content: '';
      position: absolute;
      top: 0; left: 0; width: 100%; height: 100%;
      background: linear-gradient(135deg, rgba(255,255,255,0.05) 0%, transparent 100%);
      pointer-events: none;
    }

    /* Header */
    .auth-header {
      text-align: center;
      margin-bottom: 40px;
    }
    .logo-glow {
      font-size: 56px;
      margin-bottom: 16px;
      display: inline-block;
      filter: drop-shadow(0 0 20px var(--primary-glow));
      animation: float 4s infinite ease-in-out;
    }
    @keyframes float { 0%, 100% { transform: translateY(0); } 50% { transform: translateY(-10px); } }
    
    .auth-title { font-size: 32px; font-weight: 800; letter-spacing: -1px; margin-bottom: 8px; }
    .auth-title span { color: var(--primary); }
    .auth-subtitle { color: var(--text-dim); font-size: 15px; }

    /* Premium Tab Switcher */
    .tab-container {
      background: rgba(0,0,0,0.3);
      border-radius: 20px;
      padding: 6px;
      display: flex;
      position: relative;
      margin-bottom: 32px;
      border: 1px solid var(--border);
    }
    .tab-btn {
      flex: 1;
      padding: 12px;
      text-align: center;
      font-size: 14px;
      font-weight: 700;
      color: var(--text-dim);
      cursor: pointer;
      z-index: 5;
      transition: all 0.4s cubic-bezier(0.4, 0, 0.2, 1);
      text-transform: uppercase;
      letter-spacing: 1px;
    }
    .tab-btn.active { color: white; }
    .tab-slider {
      position: absolute;
      top: 6px; left: 6px;
      width: calc(50% - 6px); height: calc(100% - 12px);
      background: linear-gradient(135deg, var(--primary) 0%, #5C8A11 100%);
      border-radius: 16px;
      box-shadow: 0 4px 15px var(--primary-glow);
      transition: transform 0.5s cubic-bezier(0.68, -0.6, 0.32, 1.6);
      z-index: 1;
    }

    /* Form Styles */
    .form-stack { position: relative; min-height: 380px; }
    .auth-form {
      position: absolute;
      top: 0; left: 0; width: 100%;
      opacity: 0; pointer-events: none;
      transform: translateX(20px);
      transition: all 0.5s cubic-bezier(0.4, 0, 0.2, 1);
    }
    .auth-form.active {
      opacity: 1; pointer-events: all;
      transform: translateX(0);
    }

    .input-group {
      margin-bottom: 24px;
      position: relative;
    }
    .input-group i {
      position: absolute;
      left: 20px; top: 18px;
      color: var(--text-dim);
      font-size: 18px;
      transition: color 0.3s;
    }
    .premium-input {
      width: 100%;
      background: rgba(0,0,0,0.2);
      border: 1px solid var(--border);
      border-radius: 16px;
      padding: 18px 20px 18px 56px;
      color: white;
      font-family: inherit;
      font-size: 16px;
      transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
    }
    .premium-input:focus {
      outline: none;
      border-color: var(--primary);
      background: rgba(0,0,0,0.4);
      box-shadow: 0 0 20px rgba(124, 181, 24, 0.15);
    }
    .premium-input:focus + i { color: var(--primary); }

    .eye-toggle {
      position: absolute;
      right: 20px; top: 18px;
      background: none; border: none;
      color: var(--text-dim);
      cursor: pointer; font-size: 18px;
    }

    /* Buttons */
    .btn-submit {
      width: 100%;
      padding: 18px;
      border-radius: 18px;
      border: none;
      background: linear-gradient(135deg, var(--primary) 0%, #5C8A11 100%);
      color: white;
      font-family: 'Outfit', sans-serif;
      font-weight: 800;
      font-size: 18px;
      cursor: pointer;
      box-shadow: 0 10px 30px var(--primary-glow);
      transition: all 0.3s;
      display: flex; align-items: center; justify-content: center; gap: 12px;
    }
    .btn-submit:hover { transform: translateY(-3px) scale(1.02); box-shadow: 0 15px 40px var(--primary-glow); }
    .btn-submit:active { transform: translateY(0) scale(0.98); }

    .btn-google {
      width: 100%;
      padding: 16px;
      border-radius: 18px;
      background: rgba(255,255,255,0.05);
      border: 1px solid var(--border);
      color: white;
      font-family: inherit; font-weight: 600;
      display: flex; align-items: center; justify-content: center; gap: 12px;
      margin-top: 24px;
      cursor: pointer; transition: all 0.3s;
    }
    .btn-google:hover { background: rgba(255,255,255,0.1); border-color: rgba(255,255,255,0.3); }

    .forgot-link {
      display: block; text-align: center; margin-top: 16px;
      color: var(--text-dim); font-size: 14px; text-decoration: none;
      transition: color 0.3s; cursor: pointer;
    }
    .forgot-link:hover { color: var(--primary); }

    .auth-error {
      color: #FF4B2B; font-size: 13px; text-align: center;
      margin-top: 12px; min-height: 20px;
    }

    .back-btn {
      display: flex; align-items: center; justify-content: center; gap: 8px;
      margin-top: 40px; color: var(--text-dim); text-decoration: none;
      font-weight: 600; font-size: 14px; transition: color 0.3s;
    }
    .back-btn:hover { color: white; }

    /* Toast Notification (Crazy style) */
    .toast {
      position: fixed; top: 40px; left: 50%; transform: translateX(-50%) translateY(-100px);
      background: rgba(255, 255, 255, 0.1);
      backdrop-filter: blur(15px);
      border: 1px solid rgba(255,255,255,0.2);
      padding: 16px 32px;
      border-radius: 20px;
      display: flex; align-items: center; gap: 16px;
      box-shadow: 0 20px 40px rgba(0,0,0,0.4);
      z-index: 1000;
      transition: all 0.5s cubic-bezier(0.175, 0.885, 0.32, 1.275);
    }
    .toast.show { transform: translateX(-50%) translateY(0); }
    .toast i { color: var(--primary); font-size: 20px; }

    /* Mobile Adjustments */
    @media (max-width: 480px) {
      .auth-card { padding: 32px 24px; }
      .auth-title { font-size: 28px; }
    }
  </style>
</head>
<body>

  <div class="mesh-bg">
    <div class="blob blob-1"></div>
    <div class="blob blob-2"></div>
    <div class="blob blob-3"></div>
  </div>

  <div class="auth-wrapper" id="auth-screen">
    <div class="auth-header">
      <div class="logo-glow">🐄</div>
      <h1 class="auth-title">Kisan<span>Track</span></h1>
      <p class="auth-subtitle">AI-Powered Livestock Intelligence</p>
    </div>

    <div class="auth-card">
      <div class="tab-container">
        <div class="tab-btn active" id="tab-login">Login</div>
        <div class="tab-btn" id="tab-signup">Join Us</div>
        <div class="tab-slider" id="auth-tab-slider"></div>
      </div>

      <div class="form-stack">
        <!-- Login -->
        <form id="login-form" class="auth-form active">
          <div class="input-group">
            <i class="fa-solid fa-envelope"></i>
            <input type="email" id="login-email" class="premium-input" placeholder="Email Address" required />
          </div>
          <div class="input-group">
            <i class="fa-solid fa-lock"></i>
            <input type="password" id="login-password" class="premium-input" placeholder="Password" required />
            <button type="button" class="eye-toggle" id="login-eye"><i class="fa-solid fa-eye"></i></button>
          </div>
          <div class="auth-error" id="login-error"></div>
          <button type="submit" class="btn-submit" id="btn-login-submit">
            Access Dashboard <i class="fa-solid fa-chevron-right"></i>
          </button>
          <a class="forgot-link" id="btn-forgot-password">Trouble signing in?</a>
        </form>

        <!-- Signup -->
        <form id="signup-form" class="auth-form">
          <div class="input-group">
            <i class="fa-solid fa-user"></i>
            <input type="text" id="signup-name" class="premium-input" placeholder="Full Name" required />
          </div>
          <div class="input-group">
            <i class="fa-solid fa-tractor"></i>
            <input type="text" id="signup-farm" class="premium-input" placeholder="Farm Name" required />
          </div>
          <div class="input-group">
            <i class="fa-solid fa-envelope"></i>
            <input type="email" id="signup-email" class="premium-input" placeholder="Email Address" required />
          </div>
          <div class="input-group">
            <i class="fa-solid fa-lock"></i>
            <input type="password" id="signup-password" class="premium-input" placeholder="Create Password" required />
            <button type="button" class="eye-toggle" id="signup-eye"><i class="fa-solid fa-eye"></i></button>
          </div>
          <div class="input-group">
            <i class="fa-solid fa-shield-check"></i>
            <input type="password" id="signup-confirm" class="premium-input" placeholder="Confirm Password" required />
            <button type="button" class="eye-toggle" id="signup-confirm-eye"><i class="fa-solid fa-eye"></i></button>
          </div>
          <div class="auth-error" id="signup-error"></div>
          <button type="submit" class="btn-submit" id="btn-signup-submit">
            Create Farm Profile <i class="fa-solid fa-paper-plane"></i>
          </button>
        </form>
      </div>

      <button type="button" class="btn-google" id="btn-google-login">
        <i class="fa-brands fa-google"></i> Continue with Google
      </button>
    </div>

    <a href="index.html" class="back-btn">
      <i class="fa-solid fa-arrow-left"></i> Return to Landing Page
    </a>
  </div>

  <div class="toast" id="app-toast">
    <i class="fa-solid fa-circle-check"></i>
    <span class="toast-msg" id="toast-msg"></span>
  </div>

  <script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-auth-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore-compat.js"></script>
  <script src="js/utils.js"></script>
  <script src="js/firebase-init.js"></script>
  <script src="js/auth.js"></script>
</body>
</html>
