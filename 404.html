<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>&#x1F33E;</text></svg>" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>KisanTrack | 404</title>
    <link rel="stylesheet" href="css/main.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
    <style>
        body {
            background: #0A0A06;
            color: #F0EAD6;
            display: flex;
            align-items: center;
            justify-content: center;
            height: 100vh;
            margin: 0;
            font-family: 'Poppins', sans-serif;
            text-align: center;
        }
        .error-container {
            max-width: 500px;
            padding: 40px;
        }
        .error-icon {
            font-size: 80px;
            color: var(--accent-amber);
            margin-bottom: 20px;
        }
        h1 {
            font-size: 3rem;
            margin-bottom: 10px;
            color: var(--accent-green);
        }
        p {
            opacity: 0.8;
            margin-bottom: 30px;
        }
        .btn-home {
            background: var(--accent-green);
            color: #0A0A06;
            padding: 12px 30px;
            border-radius: 8px;
            text-decoration: none;
            font-weight: 600;
            display: inline-block;
            transition: transform 0.2s;
        }
        .btn-home:hover {
            transform: translateY(-2px);
        }
    </style>
</head>
<body>
    <div class="error-container">
        <div class="error-icon">🐄</div>
        <h1>404</h1>
        <p>Oops! This part of the pasture doesn't exist. <br> क्षमा करें! यह पेज मौजूद नहीं है।</p>
        <a href="index.html" class="btn-home">
            <i class="fa-solid fa-house"></i> Go Back Home / होम पर वापस जाएं
        </a>
    </div>
</body>
</html>
