<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0" />
  <title>KisanTrack — Welcome | किसानट्रैक में आपका स्वागत है</title>
  <meta name="description" content="KisanTrack is a real-time livestock health monitoring dashboard for farmers." />
  <meta name="theme-color" content="#1F4E22" />

  <!-- Google Fonts -->
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700;800&family=Noto+Sans:wght@400;500;600&display=swap" rel="stylesheet" />

  <!-- Font Awesome 6 -->
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css" />

  <!-- App Stylesheets -->
  <link rel="stylesheet" href="css/main.css" />
  <link rel="stylesheet" href="css/auth.css" />

  <!-- Firebase App -->
  <script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-auth-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore-compat.js"></script>
</head>

<body>
  <div id="auth-screen">
    <div class="auth-card">
      <div class="auth-header">
        <div class="auth-logo">🌾🐄</div>
        <h2 class="auth-title">KisanTrack</h2>
        <p class="auth-subtitle">Village Livestock Monitoring <br> ग्राम पशु निगरानी</p>
      </div>

      <div class="auth-tabs">
        <button class="auth-tab active" id="tab-login" aria-selected="true">Login / लॉगिन</button>
        <button class="auth-tab" id="tab-signup" aria-selected="false">Sign Up / साइन अप</button>
        <div class="auth-tab-slider" id="auth-tab-slider"></div>
      </div>

      <div class="auth-forms-wrapper">
        <!-- Login Form -->
        <form id="login-form" class="auth-form active">
          <div class="auth-field">
            <i class="fa-solid fa-envelope"></i>
            <input type="email" id="login-email" placeholder="Email / ईमेल" required />
          </div>
          <div class="auth-field">
            <i class="fa-solid fa-lock"></i>
            <input type="password" id="login-password" placeholder="Password / पासवर्ड" required />
            <button type="button" class="auth-eye-btn" id="login-eye" aria-label="Toggle password visibility">
              <i class="fa-solid fa-eye"></i>
            </button>
          </div>
          
          <div class="auth-error-msg" id="login-error"></div>
          
          <button type="submit" class="btn-auth-primary" id="btn-login-submit">Login / लॉगिन</button>
          <div style="text-align: center;">
            <button type="button" class="btn-auth-text" id="btn-forgot-password">Forgot Password? / पासवर्ड भूल गए?</button>
          </div>
        </form>

        <!-- Signup Form -->
        <form id="signup-form" class="auth-form">
          <div class="auth-field">
            <i class="fa-solid fa-user"></i>
            <input type="text" id="signup-name" placeholder="Full Name / पूरा नाम" required />
          </div>
          <div class="auth-field">
            <i class="fa-solid fa-tractor"></i>
            <input type="text" id="signup-farm" placeholder="Farm Name / खेत का नाम" required />
          </div>
          <div class="auth-field">
            <i class="fa-solid fa-envelope"></i>
            <input type="email" id="signup-email" placeholder="Email / ईमेल" required />
          </div>
          <div class="auth-field">
            <i class="fa-solid fa-lock"></i>
            <input type="password" id="signup-password" placeholder="Password (min 6) / पासवर्ड" required />
            <button type="button" class="auth-eye-btn" id="signup-eye" aria-label="Toggle password visibility">
              <i class="fa-solid fa-eye"></i>
            </button>
          </div>
          <div class="auth-field">
            <i class="fa-solid fa-lock"></i>
            <input type="password" id="signup-confirm" placeholder="Confirm Password / पासवर्ड की पुष्टि" required />
            <button type="button" class="auth-eye-btn" id="signup-confirm-eye" aria-label="Toggle password visibility">
              <i class="fa-solid fa-eye"></i>
            </button>
          </div>
          
          <div class="auth-error-msg" id="signup-error"></div>
          
          <button type="submit" class="btn-auth-primary" id="btn-signup-submit">Sign Up / साइन अप</button>
        </form>
      </div>

      <div class="auth-divider">
        <span>OR / या</span>
      </div>

      <button class="btn-auth-google" id="btn-google-login">
        <img src="https://upload.wikimedia.org/wikipedia/commons/c/c1/Google_%22G%22_logo.svg" alt="Google Logo" />
        Continue with Google
      </button>
    </div>
  </div>

  <!-- Toast Notification -->
  <div class="toast" id="app-toast" role="alert" aria-live="polite">
    <i class="fa-solid fa-circle-check toast-icon"></i>
    <span class="toast-msg" id="toast-msg">Action completed.</span>
  </div>

  <!-- Scripts -->
  <script src="js/utils.js"></script>
  <script src="js/firebase-init.js"></script>
  <script>
    // We are on landing page. Set global flag so auth.js knows to redirect on login
    window.isLandingPage = true;
  </script>
  <script src="js/auth.js"></script>
</body>
</html>
